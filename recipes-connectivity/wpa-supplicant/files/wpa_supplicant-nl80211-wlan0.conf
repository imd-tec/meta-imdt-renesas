ctrl_interface=/var/run/wpa_supplicant
ctrl_interface_group=0
update_config=1
country=DE

# NOTE: the SDIW416 enforces #channels <= 1 — wlan0 and uap0 cannot operate
# on different channels simultaneously. hostapd (uap0) is enabled by default;
# wpa_supplicant (wlan0) is disabled. To use client mode: stop hostapd first.

