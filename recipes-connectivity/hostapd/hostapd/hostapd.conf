interface=uap0
logger_syslog=-1
logger_syslog_level=2
logger_stdout=-1
logger_stdout_level=2
ctrl_interface=/var/run/hostapd
ctrl_interface_group=0

ssid=imdt-v2h-sbc-ap

# 5GHz 802.11a/n
# NOTE: the SDIW416 enforces #channels <= 1 across all interfaces.
# If wlan0 is associated to an upstream AP, it must be on this same channel.
hw_mode=a
channel=36

# 802.11n (HT40+) — capabilities derived from iw list (0x137e)
ieee80211n=1
ht_capab=[HT40+][SHORT-GI-20][SHORT-GI-40][DSSS_CCK-40]

# WMM is mandatory for 802.11n
wmm_enabled=1

beacon_int=100
dtim_period=2
max_num_sta=8
rts_threshold=-1
fragm_threshold=-1

macaddr_acl=0
ignore_broadcast_ssid=0

own_ip_addr=172.16.10.100

# WPA2-PSK
auth_algs=1
wpa=2
wpa_psk=d75f2c4babacce8f51eee22b5945d4754a95ebf970b8d5bf6eadf10cb9681e37
wpa_key_mgmt=WPA-PSK
wpa_pairwise=CCMP
rsn_pairwise=CCMP

eapol_key_index_workaround=0
eap_server=0
