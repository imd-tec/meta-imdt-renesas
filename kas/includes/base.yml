header:
  version: 15

repos:
  meta-renesas:
    url: https://github.com/renesas-rz/meta-renesas
    branch: scarthgap/rz
    path: sources/meta-renesas
    layers:
      meta-rz-distro:
      meta-rz-bsp:
  poky:
    url: https://git.yoctoproject.org/git/poky
    branch: scarthgap
    path: sources/poky
    commit: ae2d52758fc2fcb0ed996aa234430464ebf4b310
    layers:
      meta:
      meta-poky:
      meta-yocto-bsp:

  meta-arm:
    url: https://git.yoctoproject.org/meta-arm
    # yocto-5.0.2
    path: sources/meta-arm
    commit: 8e0f8af90fefb03f08cd2228cde7a89902a6b37c
    layers:
      meta-arm-toolchain:
      meta-arm:
  
  meta-openembedded:
    url: https://github.com/openembedded/meta-openembedded
    branch: scarthgap
    path: sources/meta-openembedded
    commit: c29a18fa39ede952f3f6108ec007c1906e2d9a0d
    layers:
      meta-oe:
      meta-python:
      meta-multimedia:

  meta-swupdate:
    url: https://github.com/sbabic/meta-swupdate
    branch: scarthgap
    commit: 226701adf0f7c8ed08d4d6a7783e88d34ef2d5e9
    path: sources/meta-swupdate

env:
  IMDT_DISTRO_VERSION: "0.0.0" # Place holder - will be replaced by the actual tag in the build environment
local_conf_header:
  imdt: |
    DISTRO ?= "imdt"
    CONF_VERSION = "2"
    BB_DISKMON_DIRS ?= " \
        STOPTASKS,${TMPDIR},1G,100K \
        STOPTASKS,${DL_DIR},1G,100K \
        STOPTASKS,${SSTATE_DIR},1G,100K \
        STOPTASKS,/tmp,100M,100K \
        HALT,${TMPDIR},100M,1K \
        HALT,${DL_DIR},100M,1K \
        HALT,${SSTATE_DIR},100M,1K \
        HALT,/tmp,10M,1K \
    "

    # Extra image configuration defaults
    EXTRA_IMAGE_FEATURES = "debug-tweaks tools-profile tools-testapps"

    # Remove dnf package which causes high CPU workload
    PACKAGE_INSTALL:remove = " dnf "

    # Additional image features
    USER_CLASSES ?= "buildstats"
    IMAGE_INSTALL:remove = " rz-tvm-runtime"