# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILES_DYNAMIC += "\
    rz-drpai:${LAYERDIR}/dynamic-layers/meta-rz-drpai/recipes-*/*/*.bb \
    rz-drpai:${LAYERDIR}/dynamic-layers/meta-rz-drpai/recipes-*/*/*.bbappend \
    rz-codecs:${LAYERDIR}/dynamic-layers/meta-rz-codecs/recipes-*/*/*.bbappend \
    rz-opencva:${LAYERDIR}/dynamic-layers/meta-rz-opencva/recipes-*/*/*.bbappend \
    rz-graphics:${LAYERDIR}/dynamic-layers/meta-rz-graphics/recipes-*/*/*.bbappend \
    rz-codecs:${LAYERDIR}/dynamic-layers/recipes-*/*/*.bbappend \
    rz-opencva:${LAYERDIR}/dynamic-layers/recipes-*/*/*.bbappend \
"

BBFILE_COLLECTIONS += "imdt-renesas"
BBFILE_PATTERN_imdt-renesas = "^${LAYERDIR}/"
BBFILE_PRIORITY_imdt-renesas = "20"

LAYERDEPENDS_imdt-renesas = "rz-common rzv2h"
LAYERSERIES_COMPAT_imdt-renesas = "dunfell"

# Add a file containing the git commit hashes of the layers that contributed to this image build (/etc/build)
INHERIT += " image-buildinfo"

# Debian snapshot mirrors for reproducible builds
PREMIRRORS += " \
  http://security.debian.org/debian-security/ https://snapshot.debian.org/archive/debian-security/20240701T000000Z/ \n \
  https://security.debian.org/debian-security/ https://snapshot.debian.org/archive/debian-security/20240701T000000Z/ \n \
  http://deb.debian.org/debian/ https://snapshot.debian.org/archive/debian/20240701T000000Z/ \n \
  https://deb.debian.org/debian/ https://snapshot.debian.org/archive/debian/20240701T000000Z/ \n \
  http://ftp.debian.org/debian/ https://snapshot.debian.org/archive/debian/20240701T000000Z/ \n \
  https://ftp.debian.org/debian/ https://snapshot.debian.org/archive/debian/20240701T000000Z/ \n \
  https://ftp.gnu.org/ https://ftpmirror.gnu.org/ \n \
  http://ftp.gnu.org/ https://ftpmirror.gnu.org/ \n \
"