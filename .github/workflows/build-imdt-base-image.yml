name: Build IMDT Base Image

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  pull_request:

# checks/pull-requests are needed by the LAVA job below; a called workflow cannot
# request more than the caller grants.
permissions:
  contents: write
  checks: write
  pull-requests: write

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      wg-slot: ${{ steps.cfg.outputs.wg-slot }}
    steps:
      - id: cfg
        run: |
          # Which pre-provisioned WireGuard peer this repo uses. Kept in a repo
          # variable so a fork or twin picks a different one with this same file;
          # two live tunnels on one peer silently kill each other.
          WG_SLOT_BASE="${{ vars.WG_SLOT_BASE }}"
          if ! [[ "$WG_SLOT_BASE" =~ ^[0-9]+$ ]]; then
            echo "WG_SLOT_BASE repo variable is unset or not numeric" >&2
            exit 1
          fi
          echo "wg-slot=$((WG_SLOT_BASE))" >> "$GITHUB_OUTPUT"

  build:
    uses: imd-tec/kas-gh-ci/.github/workflows/kas-build.yml@master
    with:
      kas-config: 'kas/imdt-v2h-base.yml'
      machine: 'imdt-v2h-sbc'
      artifact-name: 'imdt-image-base'
      # Stage the rootfs on the LAVA worker for the fastboot deploy below. This
      # runs on-prem, so the image never crosses the WireGuard tunnel.
      rsync-enabled: true
      rsync-host: ${{ vars.LAVA_WORKER_HOST }}
      rsync-user: ${{ vars.LAVA_WORKER_USER }}
      rsync-dest: ${{ vars.LAVA_IMAGES_DIR }}/
      rsync-pattern: '*.rootfs.ext4'
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  lava-tests:
    needs: [setup, build]
    uses: ./.github/workflows/lava-tests.yml
    with:
      image-name: 'imdt-image-base'
      machine: 'imdt-v2h-sbc'
      wg-slot: ${{ needs.setup.outputs.wg-slot }}
      is-pr: ${{ github.event_name == 'pull_request' }}
      pr-number: ${{ github.event.pull_request.number || 0 }}
    secrets: inherit
